<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>1688 智能选品工作台</title>
  <style>
    :root{--primary:#2563eb;--primary-soft:#eff6ff;--bg:#f3f4f6;--surface:#fff;--border:#e5e7eb;--text:#18212f;--sub:#667085;--muted:#98a2b3;--danger:#dc2626;--sidebar:260px;--preview:440px;--r-sm:6px;--r-md:10px;--r-lg:14px;--shadow:0 10px 32px rgba(16,24,40,.10)}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Microsoft YaHei UI","PingFang SC","Noto Sans CJK SC",sans-serif;color:var(--text);background:radial-gradient(circle at 15% 0,#fff 0,transparent 26%),var(--bg);font-size:14px;overflow:hidden}
    button,input,textarea{font:inherit}button{color:inherit}.app{height:100vh;display:grid;grid-template-columns:var(--sidebar) minmax(420px,1fr) var(--preview);animation:enter .45s ease both}@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.icon-sm{width:16px;height:16px}.btn{border:1px solid var(--border);background:var(--surface);border-radius:var(--r-sm);height:34px;padding:0 11px;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;transition:.16s ease}.btn:hover{border-color:#cbd5e1;background:#f8fafc}.btn:focus-visible,.session:focus-visible,.result-card:focus-visible,.tab:focus-visible{outline:3px solid rgba(37,99,235,.18);outline-offset:1px}.btn.primary{background:var(--text);color:#fff;border-color:var(--text)}.btn.primary:hover{background:#273244}.icon-btn{width:34px;padding:0}.hidden{display:none!important}
    .sidebar{height:100%;background:rgba(247,248,250,.96);border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0}.brand{height:58px;padding:0 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(229,231,235,.75)}.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--text);display:grid;place-items:center;color:#fff;font-weight:700}.brand b{font-size:15px}.new-wrap{padding:14px 12px 10px}.new-chat{width:100%;justify-content:flex-start;height:38px}.search-wrap{padding:0 12px 10px;position:relative}.search-wrap .icon{position:absolute;left:22px;top:9px;color:var(--muted)}.search{width:100%;height:36px;border:1px solid transparent;background:#eceff3;border-radius:8px;padding:0 10px 0 34px;color:var(--text);outline:0}.search:focus{background:#fff;border-color:#bfdbfe}.sessions{flex:1;overflow:auto;padding:0 8px 16px}.group-title{font-size:11px;color:var(--muted);padding:13px 9px 6px}.session{width:100%;border:0;background:transparent;border-radius:8px;padding:9px 9px;text-align:left;cursor:pointer;display:grid;grid-template-columns:1fr 24px;gap:6px;align-items:center;transition:.16s}.session:hover{background:#eceff3}.session.active{background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.06)}.session-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.session-meta{font-size:11px;color:var(--muted);margin-top:3px}.more{border:0;background:transparent;color:var(--muted);width:24px;height:24px;border-radius:5px;cursor:pointer}.more:hover{background:#e5e7eb;color:var(--text)}.sidebar-foot{padding:10px 12px;border-top:1px solid var(--border)}.profile{display:flex;align-items:center;gap:10px;padding:7px}.avatar{width:30px;height:30px;border-radius:50%;background:#dbeafe;color:#1d4ed8;display:grid;place-items:center;font-weight:700}.profile small{display:block;color:var(--muted);margin-top:2px}
    .conversation{height:100%;background:rgba(255,255,255,.98);border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0}.chat-head{height:58px;border-bottom:1px solid var(--border);padding:0 18px;display:flex;align-items:center;justify-content:space-between}.chat-title{font-weight:700}.chat-sub{font-size:11px;color:var(--muted);margin-top:3px}.head-actions{display:flex;gap:7px}.messages{flex:1;overflow:auto;padding:26px max(24px,7vw) 18px;scroll-behavior:smooth}.message{margin-bottom:24px;animation:messageIn .24s ease both}@keyframes messageIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.message.user{display:flex;justify-content:flex-end}.bubble-user{max-width:78%;background:#f1f3f5;border-radius:14px 14px 4px 14px;padding:11px 14px;line-height:1.65}.assistant-row{display:grid;grid-template-columns:28px 1fr;gap:11px}.assistant-mark{width:28px;height:28px;border-radius:8px;background:var(--text);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}.answer{line-height:1.75;color:#344054}.answer b{color:var(--text)}.answer-tools{display:flex;gap:4px;margin-top:8px}.answer-tools .btn{height:28px;border:0;color:var(--muted);padding:0 7px}.answer-tools .btn:hover{color:var(--text);background:#f2f4f7}.result-card{margin-top:12px;border:1px solid var(--border);background:#fafbfc;border-radius:var(--r-md);padding:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;text-align:left;width:100%;transition:.18s}.result-card:hover{border-color:#bfdbfe;background:#f8fbff;transform:translateY(-1px)}.result-card.active{border-color:#93c5fd;background:var(--primary-soft)}.result-name{font-weight:700}.result-meta{font-size:12px;color:var(--sub);margin-top:4px}.result-arrow{color:var(--primary);display:flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap}.typing{display:flex;gap:5px;padding:8px 0}.typing i{width:6px;height:6px;border-radius:50%;background:#94a3b8;animation:dot 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes dot{50%{transform:translateY(-4px);opacity:.5}}
    .composer-wrap{padding:10px max(24px,7vw) 18px;background:linear-gradient(transparent,#fff 24%)}.composer{border:1px solid #d7dce2;border-radius:var(--r-lg);background:#fff;box-shadow:0 5px 20px rgba(16,24,40,.07);padding:10px 10px 8px;transition:.18s}.composer:focus-within{border-color:#93c5fd;box-shadow:0 0 0 3px rgba(37,99,235,.08),0 7px 24px rgba(16,24,40,.08)}.composer textarea{width:100%;height:54px;resize:none;border:0;outline:0;padding:4px 5px;color:var(--text)}.composer textarea::placeholder{color:#a4acb9}.composer-foot{display:flex;justify-content:space-between;align-items:center}.composer-actions{display:flex;gap:5px}.send{width:34px;height:34px;border:0;border-radius:9px;background:var(--primary);color:#fff;cursor:pointer;display:grid;place-items:center;transition:.16s}.send:hover{background:#1d4ed8}.send:disabled{background:#cbd5e1;cursor:not-allowed}.hint{font-size:11px;color:var(--muted);text-align:center;margin-top:7px}
    .preview{height:100%;background:#fbfcfd;display:flex;flex-direction:column;min-width:0}.preview-head{height:58px;border-bottom:1px solid var(--border);padding:0 14px;display:flex;align-items:center;justify-content:space-between}.preview-title{font-weight:700}.status{font-size:11px;color:#15803d;background:#f0fdf4;padding:4px 7px;border-radius:999px}.tabs{height:43px;border-bottom:1px solid var(--border);display:flex;align-items:end;padding:0 9px;gap:4px;overflow-x:auto}.tab{height:34px;max-width:190px;border:1px solid var(--border);border-bottom:0;background:#f4f6f8;border-radius:8px 8px 0 0;padding:0 8px 0 11px;display:flex;align-items:center;gap:7px;cursor:pointer;font-size:12px;white-space:nowrap}.tab.active{background:#fff;color:#1d4ed8;border-color:#bfdbfe;box-shadow:inset 0 -2px var(--primary)}.tab-label{overflow:hidden;text-overflow:ellipsis}.tab-close{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:2px}.preview-toolbar{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;gap:7px;align-items:center}.chip{font-size:11px;background:#eef1f4;color:#475467;border-radius:6px;padding:6px 8px}.export{margin-left:auto}.products{flex:1;overflow:auto;padding:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:start;gap:10px}.product{background:#fff;border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;transition:.18s}.product:hover{border-color:#cbd5e1;box-shadow:0 5px 16px rgba(16,24,40,.07);transform:translateY(-1px)}.product-img{height:116px;background:linear-gradient(135deg,#eef2f6,#dde5ed);display:grid;place-items:center;color:#8a96a6;font-size:12px;position:relative}.product-img:before{content:"";width:48px;height:42px;border:1px solid #b7c1cc;border-radius:6px;position:absolute}.product-body{padding:9px}.product-name{font-size:12px;line-height:1.45;height:35px;overflow:hidden}.product-price{color:#e11d48;font-weight:700;margin-top:7px}.product-data{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:5px}.empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--sub);padding:30px}.empty-graphic{width:92px;height:72px;border:1px dashed #cbd5e1;border-radius:12px;margin:0 auto 14px;display:grid;place-items:center;color:#94a3b8}.empty b{display:block;color:var(--text);margin-bottom:6px}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);background:#18212f;color:#fff;padding:9px 13px;border-radius:8px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s;z-index:9}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:1100px){:root{--preview:360px}.app{grid-template-columns:220px minmax(380px,1fr) var(--preview)}}
    @media(max-width:850px){body{overflow:auto}.app{height:auto;min-height:100vh;grid-template-columns:210px 1fr}.preview{grid-column:1/-1;height:560px;border-top:1px solid var(--border)}.sidebar,.conversation{height:100vh}}
    @media(max-width:620px){.app{display:block}.sidebar{height:auto;max-height:300px}.conversation{height:720px}.preview{height:620px}.messages,.composer-wrap{padding-left:16px;padding-right:16px}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">选</div><div><b>1688 智能选品</b></div></div>
      <div class="new-wrap"><button class="btn primary new-chat" id="newChat"><svg class="icon"><path d="M12 5v14M5 12h14"/></svg>新建选品对话</button></div>
      <div class="search-wrap"><svg class="icon icon-sm"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input class="search" id="sessionSearch" placeholder="搜索历史对话"></div>
      <div class="sessions" id="sessionList"></div>
      <div class="sidebar-foot"><div class="profile"><div class="avatar">K</div><div>选品运营员<small>工作空间管理员</small></div></div></div>
    </aside>

    <section class="conversation">
      <header class="chat-head"><div><div class="chat-title" id="chatTitle"></div><div class="chat-sub" id="chatSub"></div></div><div class="head-actions"><button class="btn icon-btn" title="分享"><svg class="icon"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.5 6.8-4M8.6 13.5l6.8 4"/></svg></button><button class="btn icon-btn" title="更多"><svg class="icon"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button></div></header>
      <div class="messages" id="messages"></div>
      <div class="composer-wrap"><div class="composer"><textarea id="prompt" placeholder="描述你想找的商品，例如：近30天上架、价格50元内的男士工装夹克"></textarea><div class="composer-foot"><div class="composer-actions"><button class="btn icon-btn" title="添加附件"><svg class="icon"><path d="M12 5v14M5 12h14"/></svg></button><button class="btn" title="筛选条件"><svg class="icon icon-sm"><path d="M4 6h16M7 12h10M10 18h4"/></svg>筛选</button></div><button class="send" id="send" title="发送"><svg class="icon"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button></div></div><div class="hint">Enter 发送，Shift + Enter 换行</div></div>
    </section>

    <aside class="preview">
      <header class="preview-head"><div class="preview-title">商品结果</div><span class="status">Dify 接口待接入</span></header>
      <div class="tabs" id="tabs"></div>
      <div class="preview-toolbar hidden" id="previewToolbar"><span class="chip">近30天</span><span class="chip">销量优先</span><span class="chip" id="countChip"></span><button class="btn export" id="exportBtn"><svg class="icon icon-sm"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>导出 CSV</button></div>
      <div class="products hidden" id="products"></div>
      <div class="empty" id="empty"><div><div class="empty-graphic"><svg class="icon" style="width:32px;height:32px"><path d="M3 6h18v12H3z"/><path d="m3 6 4-3h10l4 3M8 10h8"/></svg></div><b>等待商品结果</b><span>在中间发起选品对话，结果会在这里以 Tab 形式打开。</span></div></div>
    </aside>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const MOCK_DB={
      sessions:[
        {id:"s1",group:"今天",title:"秋季男装选品",updated:"10:42",messages:[
          {role:"user",text:"帮我找近30天上架、销量高的男士休闲外套"},
          {role:"assistant",text:"已完成五层检索，合并去重后找到 <b>61 件商品</b>。价格主要集中在 ¥38–¥89，轻商务夹克和宽松工装款近期表现较好。",result:"r1"},
          {role:"user",text:"再找价格 50 元以内的工装夹克"},
          {role:"assistant",text:"已继承上一次的男装与近30天条件，并增加价格上限与工装款式筛选，找到 <b>24 件商品</b>。",result:"r2"}
        ],results:[
          {id:"r1",name:"男士休闲外套",count:61,products:["休闲立领夹克","宽松工装外套","轻商务棒球服","秋季翻领夹克","潮流机能外套","薄款防风夹克"],prices:[39.9,52.8,68,45,76.5,58]},
          {id:"r2",name:"工装夹克 ¥50内",count:24,products:["复古多袋工装夹克","基础款翻领外套","秋季宽松夹克","日系休闲工装服","简约通勤外套","青年薄款夹克"],prices:[42,36.8,49.9,45.5,38,47]}
        ]},
        {id:"s2",group:"今天",title:"万圣节新品",updated:"09:18",messages:[{role:"user",text:"找近30天上架的万圣节产品"},{role:"assistant",text:"已识别节日主题、新品时间与热销排序条件，共找到 <b>48 件商品</b>。",result:"r3"}],results:[{id:"r3",name:"万圣节新品",count:48,products:["南瓜灯装饰套装","万圣节斗篷","发光幽灵挂件","儿童巫师帽","派对气球组合","桌面南瓜摆件"],prices:[12.8,18,9.9,7.5,15.9,11.2]}]},
        {id:"s3",group:"今天",title:"邂逅花园系列",updated:"昨天",messages:[{role:"user",text:"搜索邂逅花园系列"},{role:"assistant",text:"已使用系列词作为强检索锚点，找到 <b>32 件高相关商品</b>。",result:"r4"}],results:[{id:"r4",name:"邂逅花园系列",count:32,products:["花园系列连衣裙","法式碎花衬衫","复古花卉半裙","轻薄印花开衫","田园风吊带裙","花卉雪纺上衣"],prices:[79,59,65,48,72,52]}]},
        {id:"s4",group:"更早",title:"大码连衣裙",updated:"周一",messages:[{role:"user",text:"大码连衣裙"},{role:"assistant",text:"已识别人群属性与核心品类，共找到 <b>76 件商品</b>。",result:"r5"}],results:[{id:"r5",name:"大码连衣裙",count:76,products:["大码显瘦连衣裙","宽松雪纺长裙","胖妹妹收腰裙","通勤大码裙装","法式印花长裙","遮肉A字裙"],prices:[69,55,72,86,78,63]}]},
        {id:"s5",group:"更早",title:"毛绒玩具",updated:"上周",messages:[{role:"user",text:"毛绒玩具"},{role:"assistant",text:"已完成玩具类目检索和热销排序，共找到 <b>92 件商品</b>。",result:"r6"}],results:[{id:"r6",name:"毛绒玩具",count:92,products:["治愈系小熊公仔","长条抱枕玩偶","卡通兔子公仔","可爱猫咪抱枕","儿童安抚玩具","生日礼物玩偶"],prices:[18.8,25,16.5,22,19.9,29]}]}
      ]
    };

    const state={sessionId:"s1",activeResultId:"r1",openTabs:["r1","r2"],loading:false};
    const $=s=>document.querySelector(s);
    const el={sessionList:$("#sessionList"),messages:$("#messages"),chatTitle:$("#chatTitle"),chatSub:$("#chatSub"),prompt:$("#prompt"),send:$("#send"),tabs:$("#tabs"),products:$("#products"),empty:$("#empty"),toolbar:$("#previewToolbar"),count:$("#countChip"),search:$("#sessionSearch"),toast:$("#toast")};
    const iconArrow='<svg class="icon icon-sm"><path d="m9 18 6-6-6-6"/></svg>';
    function session(){return MOCK_DB.sessions.find(s=>s.id===state.sessionId)}
    function resultById(id){return session().results.find(r=>r.id===id)}
    function escapeHtml(v){return String(v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
    function renderSessions(filter=""){
      const list=MOCK_DB.sessions.filter(s=>s.title.includes(filter.trim()));let group="";el.sessionList.innerHTML="";
      list.forEach(s=>{if(s.group!==group){group=s.group;el.sessionList.insertAdjacentHTML("beforeend",`<div class="group-title">${group}</div>`)}const b=document.createElement("button");b.className="session "+(s.id===state.sessionId?"active":"");b.innerHTML=`<div><div class="session-title">${escapeHtml(s.title)}</div><div class="session-meta">${s.updated} · ${s.results.length} 个结果</div></div><span class="more">···</span>`;b.onclick=()=>switchSession(s.id);el.sessionList.appendChild(b)})
    }
    function switchSession(id){state.sessionId=id;const s=session();state.openTabs=s.results.length?[s.results[0].id]:[];state.activeResultId=state.openTabs[0]||null;renderAll()}
    function renderMessages(){const s=session();el.chatTitle.textContent=s.title;el.chatSub.textContent=`${s.messages.length} 条消息 · ${s.results.length} 个商品结果`;el.messages.innerHTML="";s.messages.forEach(m=>{
      if(m.role==="user"){el.messages.insertAdjacentHTML("beforeend",`<div class="message user"><div class="bubble-user">${escapeHtml(m.text)}</div></div>`);return}
      const active=m.result&&m.result===state.activeResultId;el.messages.insertAdjacentHTML("beforeend",`<div class="message"><div class="assistant-row"><div class="assistant-mark">AI</div><div><div class="answer">${m.text}</div>${m.result?`<button class="result-card ${active?"active":""}" data-result="${m.result}"><div><div class="result-name">${escapeHtml(resultById(m.result).name)}</div><div class="result-meta">${resultById(m.result).count} 件商品 · 已按销量排序</div></div><span class="result-arrow">在右侧查看 ${iconArrow}</span></button>`:""}<div class="answer-tools"><button class="btn" data-action="copy">复制</button><button class="btn" data-action="like">有帮助</button><button class="btn" data-action="dislike">不准确</button></div></div></div></div>`)
    });el.messages.querySelectorAll("[data-result]").forEach(b=>b.onclick=()=>openResult(b.dataset.result));el.messages.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>handleAnswerAction(b));el.messages.scrollTop=el.messages.scrollHeight}
    function handleAnswerAction(button){const action=button.dataset.action;if(action==="copy"){const answer=button.closest(".message").querySelector(".answer").innerText;navigator.clipboard?.writeText(answer);showToast("回答已复制");return}button.parentElement.querySelectorAll("[data-action]").forEach(x=>x.style.color="");button.style.color=action==="like"?"#15803d":"#dc2626";showToast(action==="like"?"感谢你的反馈":"已记录问题反馈")}
    function openResult(id){if(!state.openTabs.includes(id))state.openTabs.push(id);state.activeResultId=id;renderMessages();renderPreview()}
    function closeTab(id,e){e.stopPropagation();state.openTabs=state.openTabs.filter(x=>x!==id);if(state.activeResultId===id)state.activeResultId=state.openTabs.at(-1)||null;renderMessages();renderPreview()}
    function renderPreview(){el.tabs.innerHTML="";state.openTabs.forEach(id=>{const r=resultById(id);if(!r)return;const b=document.createElement("button");b.className="tab "+(id===state.activeResultId?"active":"");b.innerHTML=`<span class="tab-label">${escapeHtml(r.name)} · ${r.count}</span><span class="tab-close" title="关闭">×</span>`;b.onclick=()=>{state.activeResultId=id;renderMessages();renderPreview()};b.querySelector(".tab-close").onclick=e=>closeTab(id,e);el.tabs.appendChild(b)});
      const r=state.activeResultId?resultById(state.activeResultId):null;el.empty.classList.toggle("hidden",!!r);el.toolbar.classList.toggle("hidden",!r);el.products.classList.toggle("hidden",!r);if(!r)return;el.count.textContent=`共 ${r.count} 件`;el.products.innerHTML=r.products.map((p,i)=>`<article class="product"><div class="product-img">商品图片</div><div class="product-body"><div class="product-name">${escapeHtml(p)}</div><div class="product-price">¥${r.prices[i].toFixed(2)}</div><div class="product-data"><span>月销 ${(2.3-i*.27).toFixed(1)}万</span><span>已上架 ${8+i*3} 天</span></div></div></article>`).join("")}
    function renderAll(){renderSessions(el.search.value);renderMessages();renderPreview()}
    async function askWorkflow(prompt){await new Promise(r=>setTimeout(r,900));if(prompt.includes("失败"))throw new Error("模拟接口暂时不可用");const name=prompt.length>12?prompt.slice(0,12)+"…":prompt;return{message:`我已根据“${escapeHtml(prompt)}”生成新的搜索条件，并完成模拟检索，找到 <b>36 件商品</b>。接入后端后，这里将显示 Dify 工作流返回的真实分析。`,result:{id:"r"+Date.now(),name,count:36,products:["热销候选商品一","趋势候选商品二","高复购商品三","新品候选商品四","高评分商品五","潜力商品六"],prices:[29.9,45,38.8,56,42.5,33]}}}
    async function sendMessage(){const text=el.prompt.value.trim();if(!text){showToast("请输入选品需求");return}if(state.loading)return;const s=session();s.messages.push({role:"user",text});el.prompt.value="";state.loading=true;el.send.disabled=true;renderMessages();el.messages.insertAdjacentHTML("beforeend",'<div class="message" id="typing"><div class="assistant-row"><div class="assistant-mark">AI</div><div class="typing"><i></i><i></i><i></i></div></div></div>');el.messages.scrollTop=el.messages.scrollHeight;
      try{const data=await askWorkflow(text);s.results.push(data.result);s.messages.push({role:"assistant",text:data.message,result:data.result.id});state.openTabs.push(data.result.id);state.activeResultId=data.result.id}catch(err){s.messages.push({role:"assistant",text:`本次运行失败：${escapeHtml(err.message)}。请稍后重试或检查 Dify 接口配置。`})}finally{state.loading=false;el.send.disabled=false;renderAll()}}
    function newChat(){const id="s"+Date.now();MOCK_DB.sessions.unshift({id,group:"今天",title:"新选品对话",updated:"刚刚",messages:[{role:"assistant",text:"你好，我可以帮你分析关键词、执行多层搜索并整理商品结果。请描述你想找的商品。"}],results:[]});state.sessionId=id;state.openTabs=[];state.activeResultId=null;renderAll();el.prompt.focus()}
    function showToast(text){el.toast.textContent=text;el.toast.classList.add("show");setTimeout(()=>el.toast.classList.remove("show"),1800)}
    $("#newChat").onclick=newChat;el.send.onclick=sendMessage;el.prompt.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}});el.search.addEventListener("input",e=>renderSessions(e.target.value));$("#exportBtn").onclick=()=>showToast("已生成当前 Tab 的 CSV 导出任务");
    renderAll();
  </script>
</body>
</html>
